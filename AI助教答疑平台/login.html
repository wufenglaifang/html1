<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI助教答疑平台 - 用户登录</title>
  <style>
    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2c45;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 12%, rgba(255,255,255,.93) 0, rgba(255,255,255,.48) 24%, transparent 52%),
        linear-gradient(135deg, #eef8ff 0%, #f7fbff 48%, #eaf5ff 100%);
    }

    .login-page {
      width: min(100% - 40px, 420px);
      text-align: center;
      transform: translateY(-2vh);
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: #fff;
      font-size: 27px;
      font-weight: 700;
      background: linear-gradient(135deg, #4d9fff, #2879e9);
      box-shadow: 0 10px 22px rgba(54, 129, 231, .22);
    }

    h1 {
      margin: 0;
      color: #203451;
      font-size: clamp(26px, 5vw, 32px);
      font-weight: 700;
      letter-spacing: .3px;
      line-height: 1.35;
    }

    .subtitle {
      margin: 9px 0 29px;
      color: #8a9ab0;
      font-size: 15px;
      letter-spacing: .5px;
    }

    .login-card {
      padding: 31px 32px 27px;
      text-align: left;
      border: 1px solid rgba(218, 231, 246, .9);
      border-radius: 18px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 14px 34px rgba(63, 110, 161, .11);
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin-bottom: 23px;
      color: #347fe8;
      font-size: 18px;
      font-weight: 600;
    }

    .form-field { margin-bottom: 19px; }

    label {
      display: block;
      margin: 0 0 8px;
      color: #53647c;
      font-size: 14px;
      font-weight: 500;
    }

    input {
      width: 100%;
      height: 47px;
      padding: 0 14px;
      outline: none;
      border: 1px solid #dce7f4;
      border-radius: 11px;
      color: #35445c;
      font: inherit;
      font-size: 15px;
      background: #fbfdff;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    input::placeholder { color: #a7b4c6; }

    input:focus {
      border-color: #65a9ff;
      box-shadow: 0 0 0 4px rgba(73, 151, 248, .13);
      background: #fff;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 5px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #4b9cff, #287ceb);
      box-shadow: 0 7px 15px rgba(45, 123, 231, .24);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(45, 123, 231, .29);
    }

    footer { margin-top: 20px; }

    footer p {
      margin: 0;
      color: #8494a9;
      font-size: 14px;
    }

    footer a {
      color: #347fe8;
      font-weight: 500;
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .login-page { width: min(100% - 28px, 420px); transform: none; }
      .login-card { padding: 26px 22px 24px; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <header>
      <div class="brand-icon" aria-hidden="true">AI</div>
      <h1>AI助教答疑平台 - 用户登录</h1>
      <p class="subtitle">智能答疑·随时提问</p>
    </header>

    <section class="login-card" aria-label="用户登录表单">
      <form action="#" method="post">
        <fieldset>
          <legend>欢迎登录</legend>

          <div class="form-field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" required autofocus
              autocomplete="username" pattern="[A-Za-z0-9_]{3,16}"
              title="用户名应为 3 至 16 位字母、数字或下划线"
              placeholder="请输入用户名" />
          </div>

          <div class="form-field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" required
              autocomplete="current-password" placeholder="请输入密码" />
          </div>

          <button class="login-button" type="submit">登录</button>
        </fieldset>
      </form>
    </section>

    <footer>
      <p>没有账号？<a href="register.html">前往注册</a></p>
    </footer>
  </main>
</body>
</html>
