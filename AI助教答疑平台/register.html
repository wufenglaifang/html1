<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI助教答疑平台 - 用户注册</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2c45;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 12%, rgba(255,255,255,.93) 0, rgba(255,255,255,.48) 24%, transparent 52%),
        linear-gradient(135deg, #eef8ff 0%, #f7fbff 48%, #eaf5ff 100%);
    }

    .register-page {
      width: min(100% - 40px, 440px);
      padding: 32px 0;
      text-align: center;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: #fff;
      font-size: 27px;
      font-weight: 700;
      background: linear-gradient(135deg, #4d9fff, #2879e9);
      box-shadow: 0 10px 22px rgba(54, 129, 231, .22);
    }

    h1 {
      margin: 0;
      color: #203451;
      font-size: clamp(26px, 5vw, 32px);
      font-weight: 700;
      letter-spacing: .3px;
      line-height: 1.35;
    }

    .subtitle {
      margin: 9px 0 27px;
      color: #8a9ab0;
      font-size: 15px;
      letter-spacing: .5px;
    }

    .register-card {
      padding: 28px 32px 27px;
      text-align: left;
      border: 1px solid rgba(218, 231, 246, .9);
      border-radius: 18px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 14px 34px rgba(63, 110, 161, .11);
    }

    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }

    legend {
      width: 100%;
      margin-bottom: 20px;
      color: #347fe8;
      font-size: 18px;
      font-weight: 600;
    }

    .form-field { margin-bottom: 15px; }

    label {
      display: block;
      margin: 0 0 7px;
      color: #53647c;
      font-size: 14px;
      font-weight: 500;
    }

    input:not([type="checkbox"]) {
      width: 100%;
      height: 45px;
      padding: 0 13px;
      outline: none;
      border: 1px solid #dce7f4;
      border-radius: 11px;
      color: #35445c;
      font: inherit;
      font-size: 15px;
      background: #fbfdff;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    input::placeholder { color: #a7b4c6; }

    input:not([type="checkbox"]):focus {
      border-color: #65a9ff;
      box-shadow: 0 0 0 4px rgba(73, 151, 248, .13);
      background: #fff;
    }

    .agreement {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 2px 0 18px;
      color: #7c8ca1;
      font-size: 13px;
    }

    .agreement input { width: 15px; height: 15px; margin: 0; accent-color: #347fe8; }
    .agreement label { display: inline; margin: 0; color: inherit; font-size: inherit; font-weight: 400; }
    .agreement a { color: #347fe8; text-decoration: none; }

    .register-button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #4b9cff, #287ceb);
      box-shadow: 0 7px 15px rgba(45, 123, 231, .24);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .register-button:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(45, 123, 231, .29); }
    footer { margin-top: 19px; }
    footer p { margin: 0; color: #8494a9; font-size: 14px; }
    footer a { color: #347fe8; font-weight: 500; text-decoration: none; }
    footer a:hover, .agreement a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .register-page { width: min(100% - 28px, 440px); padding: 24px 0; }
      .register-card { padding: 25px 22px 24px; }
    }
  </style>
</head>
<body>
  <main class="register-page">
    <header>
      <div class="brand-icon" aria-hidden="true">AI</div>
      <h1>AI助教答疑平台 - 用户注册</h1>
      <p class="subtitle">智能答疑·随时提问</p>
    </header>

    <section class="register-card" aria-label="用户注册表单">
      <form action="#" method="post">
        <fieldset>
          <legend>创建账号</legend>

          <div class="form-field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" required autocomplete="username"
              placeholder="请输入用户名" />
          </div>

          <div class="form-field">
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" required autocomplete="email"
              pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"
              title="请输入有效的邮箱地址" placeholder="请输入邮箱地址" />
          </div>

          <div class="form-field">
            <label for="phone">手机号</label>
            <input id="phone" name="phone" type="tel" required autocomplete="tel"
              pattern="1[3-9][0-9]{9}" title="请输入 11 位中国大陆手机号码"
              placeholder="请输入11位手机号码" />
          </div>

          <div class="form-field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" required autocomplete="new-password"
              minlength="6" maxlength="20" title="密码长度应为 6 至 20 位"
              placeholder="请输入6至20位密码" />
          </div>

          <div class="form-field">
            <label for="confirm-password">确认密码</label>
            <input id="confirm-password" name="confirm-password" type="password" required autocomplete="new-password"
              minlength="6" maxlength="20" placeholder="请再次输入密码" />
          </div>

          <div class="form-field">
            <label for="birthday">出生日期</label>
            <input id="birthday" name="birthday" type="date" required autocomplete="bday" />
          </div>

          <div class="agreement">
            <input id="agreement" name="agreement" type="checkbox" required />
            <label for="agreement">我已阅读并同意<a href="#">《用户服务协议》</a></label>
          </div>

          <button class="register-button" type="submit">注册</button>
        </fieldset>
      </form>
    </section>

    <footer>
      <p>已有账号？<a href="login.html">去登录</a></p>
    </footer>
  </main>
</body>
</html>
